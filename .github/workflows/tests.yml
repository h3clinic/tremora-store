name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vidimu-code-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=detector python -m pytest -q detector/tests/test_vidimu*.py
