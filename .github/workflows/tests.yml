name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  code-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      # The whole suite, not a VIDIMU-only glob: the Ego4D and PADS engines
      # are release-gated and skip themselves when no dataset root is present,
      # so they belong in public CI rather than outside it.
      - run: PYTHONPATH=detector python -m pytest -q detector/tests
